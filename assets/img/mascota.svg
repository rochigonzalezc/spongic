<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400" role="img"
     aria-label="Mascota Spongic: una burbuja azul que guiña un ojo y sonríe, parada en un charco">
  <defs>
    <radialGradient id="sp-cuerpo" cx="36%" cy="26%" r="80%">
      <stop offset="0%"   stop-color="#A8D8F5"/>
      <stop offset="45%"  stop-color="#6BAEE0"/>
      <stop offset="100%" stop-color="#4A93D0"/>
    </radialGradient>
  </defs>

  <!-- ===================== destellos ===================== -->
  <g fill="#FFD84D">
    <path d="M40 92l4.5 12 12 4.5-12 4.5-4.5 12-4.5-12-12-4.5 12-4.5z"/>
    <path d="M300 210l3.5 9.5 9.5 3.5-9.5 3.5-3.5 9.5-3.5-9.5-9.5-3.5 9.5-3.5z"/>
  </g>
  <g fill="#BFE3F8">
    <path d="M296 92l3.5 9.5 9.5 3.5-9.5 3.5-3.5 9.5-3.5-9.5-9.5-3.5 9.5-3.5z"/>
    <path d="M34 300l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
  </g>

  <!-- ===================== charco ===================== -->
  <ellipse cx="170" cy="356" rx="112" ry="20" fill="#BFE3F8"/>
  <ellipse cx="170" cy="353" rx="86" ry="12" fill="#fff" opacity=".45"/>
  <!-- salpicaduras -->
  <g fill="#8FC9EE" stroke="#1B3B6F" stroke-width="4" stroke-linejoin="round">
    <path d="M74 320q8 13 8 18a8 8 0 0 1-16 0c0-5 8-18 8-18z"/>
    <path d="M266 314q9 14 9 19a9 9 0 0 1-18 0c0-5 9-19 9-19z"/>
    <path d="M298 340q6 9 6 12a6 6 0 0 1-12 0c0-3 6-12 6-12z"/>
  </g>

  <!-- ===================== piernas ===================== -->
  <path d="M152 268 L128 318" stroke="#1B3B6F" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M188 268 L212 318" stroke="#1B3B6F" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- ===================== zapatillas ===================== -->
  <g stroke="#1B3B6F" stroke-width="7" stroke-linejoin="round">
    <!-- pie izquierdo: puntera hacia afuera -->
    <path d="M152 314h-46a20 20 0 0 0-20 20v6a8 8 0 0 0 8 8h58a8 8 0 0 0 8-8v-14a12 12 0 0 0-8-12z" fill="#fff"/>
    <path d="M88 340h68" stroke-width="5.5" stroke-linecap="round" opacity=".38"/>
    <!-- pie derecho -->
    <path d="M188 314h46a20 20 0 0 1 20 20v6a8 8 0 0 1-8 8h-58a8 8 0 0 1-8-8v-14a12 12 0 0 1 8-12z" fill="#fff"/>
    <path d="M184 340h68" stroke-width="5.5" stroke-linecap="round" opacity=".38"/>
  </g>

  <!-- ===================== brazos ===================== -->
  <!-- izquierdo: baja al costado -->
  <path d="M80 218q-26 12 -38 30" stroke="#1B3B6F" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- derecho: levantado -->
  <path d="M262 196q32 -14 44 -44" stroke="#1B3B6F" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- ===================== cuerpo ===================== -->
  <circle cx="170" cy="175" r="106" fill="url(#sp-cuerpo)" stroke="#1B3B6F" stroke-width="8"/>

  <!-- brillos -->
  <ellipse cx="116" cy="106" rx="34" ry="20" fill="#fff" opacity=".8" transform="rotate(-40 116 106)"/>
  <ellipse cx="196" cy="78"  rx="19" ry="11" fill="#fff" opacity=".6" transform="rotate(-22 196 78)"/>
  <circle  cx="228" cy="98"  r="7"  fill="#fff" opacity=".45"/>
  <path d="M244 240a80 80 0 0 0 28-58" fill="none" stroke="#fff" stroke-width="10"
        stroke-linecap="round" opacity=".22"/>

  <!-- ===================== cara ===================== -->
  <!-- cejas -->
  <path d="M112 110q20 -17 44 -7" stroke="#1B3B6F" stroke-width="8.5" stroke-linecap="round" fill="none"/>
  <path d="M188 102q22 -9 42 8"   stroke="#1B3B6F" stroke-width="8.5" stroke-linecap="round" fill="none"/>

  <!-- ojo abierto -->
  <ellipse cx="142" cy="158" rx="19" ry="24" fill="#fff" stroke="#1B3B6F" stroke-width="6"/>
  <circle cx="145" cy="163" r="10.5" fill="#1B3B6F"/>
  <circle cx="149" cy="157" r="3.8"  fill="#fff"/>

  <!-- ojo guiñado -->
  <path d="M188 164q20 -20 42 -4" stroke="#1B3B6F" stroke-width="8.5" stroke-linecap="round" fill="none"/>

  <!-- boca abierta: cavidad, fila de dientes y lengua -->
  <path d="M122 204q48 96 96 0z" fill="#16305C" stroke="#1B3B6F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M122 204q48 19 96 0z" fill="#fff"/>
  <path d="M150 230q20 32 40 0-20 -13 -40 0z" fill="#E8384F"/>

  <!-- ===================== guantes ===================== -->
  <g stroke="#1B3B6F" stroke-width="6.5">
    <circle cx="36" cy="256" r="19" fill="#fff"/>
    <path d="M28 241v11M40 240v12" stroke-width="4" stroke-linecap="round" opacity=".45" fill="none"/>
    <circle cx="312" cy="142" r="19" fill="#fff"/>
    <path d="M304 127v11M316 126v12" stroke-width="4" stroke-linecap="round" opacity=".45" fill="none"/>
  </g>
</svg>
